spring:
  application:
    name: nagode-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nagode}
    username: ${SPRING_DATASOURCE_USERNAME:nagode}
    password: ${SPRING_DATASOURCE_PASSWORD:nagode}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: nagode
nagode:
  webhook-secret: ${WEBHOOK_SECRET:local-development-secret}
  idempotency-ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:86400}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  api-key: ${NAGODE_API_KEY:}
